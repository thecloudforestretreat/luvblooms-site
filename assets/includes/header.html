<header class="site-header" data-site-header>
  <div class="header-inner">
    <a href="/" class="logo" aria-label="LuvBlooms Home">
      <img src="/assets/images/lb_logo_transparent.png" alt="LuvBlooms">
      <span>luvblooms.us</span>
    </a>

    <nav class="nav-desktop" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>

    <button
      class="hamburger"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobileMenu"
      data-menu-open
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="menu-overlay" data-menu-overlay hidden></div>

  <aside class="menu-panel" id="mobileMenu" aria-label="Mobile menu" hidden>
    <div class="menu-top">
      <a href="/" class="menu-logo" aria-label="LuvBlooms Home">
        <img src="/assets/images/lb_logo_transparent.png" alt="LuvBlooms">
        <span>luvblooms.us</span>
      </a>

      <button class="menu-close" type="button" aria-label="Close menu" data-menu-close>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="menu-links" aria-label="Mobile navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>

    <div class="menu-footer">
      <span>Floral design for arrangements, intimate events, and brand moments.</span>
    </div>
  </aside>
